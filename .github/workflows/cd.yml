name: "Exemplo de CD"

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull Docker image
        run: docker pull fernandordev457/projeto-actions-dfe:latest

      - name: Stop Docker container
        run: docker stop projeto-actions-dfe || true

      - name: Remove Docker container
        run: docker rm projeto-actions-dfe || true

      - name: Run Docker container
        run: docker run --name projeto-actions-dfe -d --restart unless-stopped -p 8080:8080 fernandordev457/projeto-actions-dfe:latest